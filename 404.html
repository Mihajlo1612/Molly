<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stranica nije pronađena — Salon za pse Molly</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ee499a" />

    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400&family=Instrument+Sans:wght@400;500;600&family=Inter:wght@600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --pink: #ee499a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: var(--pink);
        color: #fff;
        font-family: "Instrument Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .kutija {
        max-width: 540px;
        text-align: center;
      }

      .kutija img {
        width: 88px;
        height: 88px;
        margin: 0 auto 28px;
        object-fit: contain;
      }

      .broj {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 400;
        font-size: clamp(72px, 16vw, 120px);
        line-height: 1;
        letter-spacing: -0.04em;
        color: rgba(255, 255, 255, 0.35);
      }

      h1 {
        margin-top: 12px;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 400;
        font-size: clamp(28px, 5vw, 40px);
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      p {
        margin-top: 18px;
        font-size: 16px;
        line-height: 25px;
        color: rgba(255, 255, 255, 0.9);
      }

      .radnje {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        margin-top: 36px;
      }

      .dugme {
        position: relative;
        z-index: 0;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        padding: 8px 32px;
        border-radius: 32px;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 16px;
        text-decoration: none;
        transition: color 0.35s ease;
      }

      .dugme::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        transform: scaleY(0);
        transform-origin: bottom;
        transition: transform 0.35s ease;
      }

      .dugme:hover::before {
        transform: scaleY(1);
      }

      .belo {
        background: #fff;
        color: var(--pink);
        border: 1px solid #fff;
      }
      .belo::before {
        background: var(--pink);
      }
      .belo:hover {
        color: #fff;
      }

      .prazno {
        border: 1px solid #fff;
        color: #fff;
      }
      .prazno::before {
        background: #fff;
      }
      .prazno:hover {
        color: var(--pink);
      }

      .dugme:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .dugme,
        .dugme::before {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="kutija">
      <img src="assets/images/logo.png" alt="Salon za pse Molly" />

      <div class="broj">404</div>
      <h1>Ova stranica je odlutala</h1>
      <p>
        Traženu stranicu nismo našli. Možda je adresa pogrešno otkucana ili je
        stranica premeštena. Vratite se na početnu ili nas pozovite.
      </p>

      <div class="radnje">
        <a class="dugme belo" href="/">Nazad na početnu</a>
        <a class="dugme prazno" href="tel:+38169744364">Pozovite nas</a>
      </div>
    </main>
  </body>
</html>
